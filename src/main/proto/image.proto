syntax = "proto3";

// 논리적 패키지 API 관점
package image.v1;

// Java 옵션 설정
option java_multiple_files = true;
option java_package = "flipnote.image.grpc.v1";  // Java 패키지 경로 설정
option java_outer_classname = "ImageServiceProto";           // 외부 클래스 이름 설정

// gRPC 서비스 정의
service ImageCommandService {
  // 이미지 url 조회
  rpc GetUrlByReference(GetUrlByReferenceRequest) returns (GetUrlByReferenceResponse);
  // 이미지 활성화
  rpc ActivateImage(ActivateImageRequest) returns (ActivateImageResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  rpc CleanOrphanImages(CleanOrphanImagesRequest) returns (CleanOrphanImagesResponse);
}

// 요청/응답 메시지
enum Type {
  REFERENCE_TYPE_UNSPECIFIED = 0;
  USER = 1;
  GROUP = 2;
  CARD_SET = 3;
}

message GetUrlByReferenceRequest {
  Type reference_type = 1;
  int64 reference_id = 2;
}

message GetUrlByReferenceResponse {
  string image_url = 1;
}

message ActivateImageRequest {
  int64 image_ref_id = 1;
  Type reference_type = 2;
  int64 reference_id = 3;
}

message ActivateImageResponse {
//  int64 image_ref_id = 1;
}

message ConfirmUploadRequest {
  string s3_key = 1;
  string original_file_name = 2;
}

message ConfirmUploadResponse {
  int64 image_id = 1;
  string image_url = 2;
}

message CleanOrphanImagesRequest {
  int32 batch_size = 1;
  int32 max_batches = 2;
}

message CleanOrphanImagesResponse {
  int32 processed_batches = 1;
  int32 s3_deleted_count = 2;
  int32 db_deleted_count = 3;
  int32 s3_failed_count = 4;
  int32 db_failed_count = 5;
}
